# Rebuilds the public site whenever the source changes.
# Edit files in source/  ->  push  ->  this workflow runs `npm run build` and copies source/dist/* to the
# repository root, which GitHub Pages serves (Settings -> Pages: Deploy from branch, main, / (root)).
name: Build site
on:
  push:
    branches: [main]
    paths: ['source/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: source
        run: npm ci && npm run build
      - name: Publish build to repository root
        run: |
          rm -rf assets index.html 404.html sw.js manifest.webmanifest robots.txt
          cp -r source/dist/assets source/dist/index.html source/dist/sw.js source/dist/manifest.webmanifest source/dist/robots.txt .
          cp index.html 404.html && touch .nojekyll
          git config user.name "quantis-build"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets index.html 404.html sw.js manifest.webmanifest robots.txt .nojekyll
          git diff --cached --quiet || git commit -m "Build site from source [skip ci]"
          git push
